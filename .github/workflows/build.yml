# Builds Simple Player on GitHub's machines:
#   - macOS: a universal (Apple Silicon + Intel) "Simple Player.app" in a .dmg, with FFmpeg lite
#   - Windows: SimplePlayer.exe (a compile check; the installer is still made with Build-Release.bat)
#
# Runs on every push to main, on pull requests, and by hand (Actions → Build → Run workflow).
# The files are under the run's "Artifacts". Pushing a tag like v2.1.0 also attaches the
# .dmg to a draft GitHub Release with that tag.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      FFMPEG_VERSION: n7.1.1
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # FFmpeg lite takes a few minutes; it only rebuilds when the version or the flags change
      - name: Restore FFmpeg lite
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-out/ffmpeg
          key: ffmpeg-macos-${{ env.FFMPEG_VERSION }}-${{ hashFiles('tools/ffmpeg-lite/*.sh') }}

      - name: Build FFmpeg lite (universal)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$FFMPEG_VERSION" https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          TARGET=macos ARCH=arm64 sh tools/ffmpeg-lite/build.sh ffmpeg-src ffmpeg-out
          TARGET=macos ARCH=x86_64 sh tools/ffmpeg-lite/build.sh ffmpeg-src ffmpeg-out
          lipo -create ffmpeg-out/macos-arm64/bin/ffmpeg ffmpeg-out/macos-x86_64/bin/ffmpeg -output ffmpeg-out/ffmpeg
          lipo -info ffmpeg-out/ffmpeg

      - name: Build Simple Player (universal)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/SimplePlayer \
            target/x86_64-apple-darwin/release/SimplePlayer \
            -output SimplePlayer
          lipo -info SimplePlayer

      - name: Make .app and .dmg
        run: sh tools/macos/bundle.sh SimplePlayer ffmpeg-out/ffmpeg dist

      # quick smoke test: the app starts and keeps running for a few seconds
      - name: Launch test
        run: |
          "dist/Simple Player.app/Contents/MacOS/SimplePlayer" > launch.log 2>&1 &
          PID=$!
          sleep 8
          if kill -0 "$PID" 2>/dev/null; then
            echo "still running after 8 s"
            screencapture -x screenshot.png || true
            kill "$PID"
          else
            echo "exited early:"; cat launch.log; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SimplePlayer-macOS
          path: dist/*.dmg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-launch-test
          path: |
            launch.log
            screenshot.png
          if-no-files-found: ignore

      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: SimplePlayer-Windows
          path: target/release/SimplePlayer.exe
