# Builds Simple Player on GitHub's machines:
#   - macOS: a universal (Apple Silicon + Intel) "Simple Player.app" in a .dmg, with FFmpeg lite
#   - Windows: SimplePlayer.exe (a compile check; the installer is still made with Build-Release.bat)
#
# Runs on every push to main, on pull requests, and by hand (Actions → Build → Run workflow).
# The files are under the run's "Artifacts".
#
# Pushes are test builds: Apple Silicon only and the quicker "ci" profile (Cargo.toml).
# A tag like v2.1.0 makes the real thing — universal (Apple Silicon + Intel), full release
# optimisation — and attaches the .dmg to a draft GitHub Release with that tag.
#
# Run workflow with a tag (e.g. v2.1.1) builds that tag's code the release way with this
# workflow and uploads the .dmg to that tag's existing release (it stays published): for a
# release whose own tag build failed.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build the macOS .dmg for and upload to (empty = test build)"
        required: false
        default: ""

permissions:
  contents: write

# a newer push cancels the build still running for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # set when run by hand for an existing release
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  macos:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      FFMPEG_VERSION: n7.1.1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # FFmpeg lite takes a few minutes; it only rebuilds when the version or the flags change
      - name: Restore FFmpeg lite
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: ffmpeg-out/ffmpeg
          key: ffmpeg-macos-${{ env.FFMPEG_VERSION }}-${{ hashFiles('tools/ffmpeg-lite/*.sh') }}

      - name: Build FFmpeg lite (universal)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$FFMPEG_VERSION" https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          TARGET=macos ARCH=arm64 sh tools/ffmpeg-lite/build.sh ffmpeg-src ffmpeg-out
          TARGET=macos ARCH=x86_64 sh tools/ffmpeg-lite/build.sh ffmpeg-src ffmpeg-out
          lipo -create ffmpeg-out/macos-arm64/bin/ffmpeg ffmpeg-out/macos-x86_64/bin/ffmpeg -output ffmpeg-out/ffmpeg
          lipo -info ffmpeg-out/ffmpeg

      - name: Build Simple Player
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* || -n "$RELEASE_TAG" ]]; then
            # release: universal, full optimisation
            cargo build --release --target aarch64-apple-darwin
            cargo build --release --target x86_64-apple-darwin
            lipo -create \
              target/aarch64-apple-darwin/release/SimplePlayer \
              target/x86_64-apple-darwin/release/SimplePlayer \
              -output SimplePlayer
          else
            # test build: Apple Silicon only, quicker profile
            cargo build --profile ci --target aarch64-apple-darwin
            cp target/aarch64-apple-darwin/ci/SimplePlayer SimplePlayer
          fi
          lipo -info SimplePlayer

      - name: Make .app and .dmg
        run: sh tools/macos/bundle.sh SimplePlayer ffmpeg-out/ffmpeg dist

      # quick smoke test: the app starts and keeps running for a few seconds
      - name: Launch test
        run: |
          "dist/Simple Player.app/Contents/MacOS/SimplePlayer" > launch.log 2>&1 &
          PID=$!
          sleep 8
          if kill -0 "$PID" 2>/dev/null; then
            echo "still running after 8 s"
            screencapture -x screenshot.png || true
            kill "$PID"
          else
            echo "exited early:"; cat launch.log; exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: SimplePlayer-macOS
          path: dist/*.dmg

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: macOS-launch-test
          path: |
            launch.log
            screenshot.png
          if-no-files-found: ignore

      # The audio output measured on a real Apple Silicon machine: exclusive mode at several
      # sample rates, idle and with every core busy, into the virtual BlackHole device (the
      # runners have no sound hardware). Results: the run's summary and "macOS-audio-selftest".
      - name: Audio selftest
        continue-on-error: true
        timeout-minutes: 10
        run: |
          brew install --cask blackhole-2ch
          sudo killall coreaudiod || true
          sleep 5
          set -o pipefail
          "dist/Simple Player.app/Contents/MacOS/SimplePlayer" --audio-selftest "BlackHole 2ch" 2>&1 | tee selftest.log
        shell: bash

      - name: Audio selftest summary
        if: always()
        run: |
          if [ -f selftest.log ]; then
            { echo "### macOS audio selftest"; echo; grep '^|' selftest.log || echo "(no results)"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: macOS-audio-selftest
          path: selftest.log
          if-no-files-found: ignore

      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/*.dmg

      - name: Upload to the existing release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.dmg --clobber --repo "$GITHUB_REPOSITORY"

  windows:
    # not needed when only a release's .dmg is made
    if: inputs.tag == ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            cargo build --release
            cp target/release/SimplePlayer.exe SimplePlayer.exe
          else
            cargo build --profile ci
            cp target/ci/SimplePlayer.exe SimplePlayer.exe
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: SimplePlayer-Windows
          path: SimplePlayer.exe
